<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTMP Multi-Step Form Example | Polaris Runtime</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --primary: #2f6fed;
            --primary-soft: rgba(47, 111, 237, 0.08);
            --text: #1b2430;
            --muted: #5f6b7a;
            --border: #dde5f0;
            --shadow: rgba(31, 52, 89, 0.08);
            --danger: #fff0f0;
            --danger-text: #b42318;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eef4ff 0%, #f9fbff 100%);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            padding: 32px 20px;
        }

        .page {
            width: min(760px, 100%);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 12px 30px var(--shadow);
            padding: 28px;
        }

        .header {
            margin-bottom: 20px;
        }

        .eyebrow {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 12px 0 8px;
            font-size: clamp(2rem, 3vw, 2.5rem);
        }

        .subtitle {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .wizard-shell {
            margin-top: 18px;
        }

        .step-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            color: var(--muted);
            font-weight: 600;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #dfe7f5;
            display: inline-block;
        }

        .dot.active {
            background: var(--primary);
            box-shadow: 0 0 0 4px rgba(47, 111, 237, 0.12);
        }

        .step {
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fbfcff;
        }

        h3 {
            margin: 0 0 16px;
            font-size: 1.3rem;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
        }

        .action-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            background: var(--primary);
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover:not(:disabled) {
            opacity: 0.96;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .secondary {
            background: #eef3ff;
            color: var(--primary);
        }

        .summary {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .summary-item {
            font-size: 0.98rem;
            color: var(--text);
        }

        .success-box {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 10px;
            background: rgba(42, 157, 104, 0.08);
            border: 1px solid rgba(42, 157, 104, 0.2);
            color: var(--text);
            font-weight: 600;
        }

        @media (max-width: 640px) {
            .page {
                padding: 20px 16px;
            }

            .action-row {
                flex-direction: column;
            }

            .action-row button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="header">
            <div class="eyebrow">HTMP Demo</div>
            <h1>Multi-Step Form</h1>
            <p class="subtitle">
                A lightweight wizard example built with HTMP, showing how a single reactive state object can drive a multi-step form without complex conditionals.
            </p>
        </header>

        <div id="wizard-app"></div>
    </main>

    <script type="module">
        import { HTMP } from './index.js';

        const template = `
            <div class="wizard-shell">
                <div class="step-indicator">
                    <span :class="currentStep === 1 ? 'dot active' : 'dot'"></span>
                    <span :class="currentStep === 2 ? 'dot active' : 'dot'"></span>
                    <span :class="currentStep === 3 ? 'dot active' : 'dot'"></span>
                    <span>Step {{ currentStep }} of 3</span>
                </div>

                <div class="step" :style="currentStep === 1 ? 'display: block' : 'display: none'">
                    <h3>Create Account</h3>
                    <div class="field-group">
                        <input type="text" :value="formData.email" @input="updateField(e, 'email')" placeholder="Email" />
                        <input type="password" :value="formData.password" @input="updateField(e, 'password')" placeholder="Password" />
                    </div>
                </div>

                <div class="step" :style="currentStep === 2 ? 'display: block' : 'display: none'">
                    <h3>Your Profile</h3>
                    <div class="field-group">
                        <input type="text" :value="formData.firstName" @input="updateField(e, 'firstName')" placeholder="First Name" />
                        <input type="text" :value="formData.lastName" @input="updateField(e, 'lastName')" placeholder="Last Name" />
                    </div>
                </div>

                <div class="step" :style="currentStep === 3 ? 'display: block' : 'display: none'">
                    <h3>Review Your Data</h3>
                    <div class="summary">
                        <div class="summary-item"><strong>Email:</strong> {{ formData.email }}</div>
                        <div class="summary-item"><strong>Name:</strong> {{ formData.firstName }} {{ formData.lastName }}</div>
                    </div>

                    <div class="success-box" :style="submitted ? 'display: block' : 'display: none'">
                        Success! {{ formData.email }} and {{ formData.firstName }} {{ formData.lastName }} are registered.
                    </div>
                </div>

                <div class="action-row">
                    <button class="secondary" @click="prevStep()" :disabled="currentStep === 1">Previous</button>
                    <button @click="nextStep()" :style="currentStep === 3 ? 'display: none' : 'display: inline-block'">Next</button>
                    <button @click="submitForm()" :style="currentStep === 3 ? 'display: inline-block' : 'display: none'" :disabled="submitted">Submit</button>
                </div>
            </div>
        `;

        const wizard = new HTMP('wizard-app', template);

        wizard.setProxy({
            currentStep: 1,
            submitted: false,
            formData: {
                email: '',
                password: '',
                firstName: '',
                lastName: ''
            }
        });

        wizard.setProgram({
            updateField: (e, fieldName) => {
                wizard.proxy.formData[fieldName] = e.target.value;
            },

            nextStep: () => {
                if (wizard.proxy.currentStep < 3) wizard.proxy.currentStep++;
            },

            prevStep: () => {
                if (wizard.proxy.currentStep > 1) wizard.proxy.currentStep--;
            },

            submitForm: () => {
                wizard.proxy.submitted = true;
                alert(`Success! ${wizard.proxy.formData.email} and ${wizard.proxy.formData.firstName} ${wizard.proxy.formData.lastName} are registered.`);
            }
        });

        wizard.mount();
    </script>
</body>
</html>
